<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen & Audio Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>🎥 Screen Recorder</h1>

    <div class="settings">
      <h3>Sources Audio</h3>

      <label class="checkbox-container">
        <input type="checkbox" id="microphoneCheck" checked>
        <span>🎤 Microphone</span>
      </label>

      <label class="checkbox-container">
        <input type="checkbox" id="systemAudioCheck" checked>
        <span>🔊 Audio du navigateur</span>
      </label>
    </div>

    <div class="status" id="status">
      <p>Prêt à enregistrer</p>
    </div>

    <div class="timer" id="timer" style="display: none;">
      <span id="timerDisplay">00:00:00</span>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn btn-start">
        <span class="btn-icon">⏺</span>
        Démarrer l'enregistrement
      </button>

      <button id="stopBtn" class="btn btn-stop" style="display: none;">
        <span class="btn-icon">⏹</span>
        Arrêter l'enregistrement
      </button>
    </div>

    <div class="info">
      <p>💡 Cette extension capture votre écran + audio pour vos démos</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
